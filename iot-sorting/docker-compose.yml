services:
  postgres:
    image: postgres:16-alpine
    container_name: iot-sorting-postgres
    environment:
      POSTGRES_DB: iot_sorting
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      TZ: America/Sao_Paulo
    ports:
      - "5432:5432"
    volumes:
      - iot_sorting_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d iot_sorting"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  iot_sorting_data:
    name: iot_sorting_data
