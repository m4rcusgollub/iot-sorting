# =====================================================================
# IoT Sorting - Configuracoes da aplicacao
# =====================================================================

spring.application.name=iot-sorting

# Servidor / Dashboard (http://localhost:8080)
server.port=8080
server.error.include-message=always

# =====================================================================
# Banco de dados SQLite (arquivo local persistente, sem Docker)
# =====================================================================
spring.datasource.url=jdbc:sqlite:iot_sorting.db?date_class=TEXT
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

# =====================================================================
# JPA / Hibernate
# =====================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# =====================================================================
# JSON
# =====================================================================
spring.jackson.mapper.accept-case-insensitive-enums=true
spring.jackson.serialization.write-dates-as-timestamps=false

# =====================================================================
# Regras de negocio do IoT Sorting
# =====================================================================

# Tempo sem comunicacao (em segundos) para o dispositivo ser considerado OFFLINE
iot.sorting.dispositivo.tempo-limite-offline-segundos=60

# Intervalo (em milissegundos) da verificacao que marca dispositivos inativos como OFFLINE
iot.sorting.monitor.intervalo-verificacao-ms=5000

# Cria o dispositivo "Esteira Principal" (ESP32CAM-001) na primeira execucao.
# Altere para false para desativar a inicializacao automatica.
iot.sorting.inicializacao.criar-dispositivo-padrao=true

# CORS: origens (ou padroes) de um frontend separado, separadas por virgula.
# O dashboard e o simulador do celular (/simulador.html) sao servidos pela propria
# aplicacao (mesma origem). O valor abaixo e o padrao usado tambem no backend publicado,
# para que o simulador aberto no notebook (rede local) consiga ler a API do Render.
# Libera APENAS loopback e a rede local na porta 8080; qualquer outra origem recebe 403.
# Pode ser sobrescrito pela variavel de ambiente IOT_SORTING_CORS_ORIGENS_PERMITIDAS
# (veja o README, secao Simulador do celular).
iot.sorting.cors.origens-permitidas=http://localhost:8080,http://127.0.0.1:8080,http://192.168.*.*:8080

# =====================================================================
# Logs
# =====================================================================
logging.level.com.iotsorting=INFO
logging.level.org.hibernate.SQL=WARN
